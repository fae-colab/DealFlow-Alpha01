name: DealFlow CI

on:
  push:
    branches:
      - main
      - baseline/alpha-01.2
      - "chore/**"
      - "fix/**"
      - "migration/**"
      - "integration/**"
      - "test/**"
      - "feature/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python + JavaScript integrity tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Python engine tests
        run: python -m unittest -v test_engine.py test_parity.py test_validation_cases.py

      - name: Run JavaScript engine tests
        run: |
          node test_engine.js
          node test_evidence.js
          node test_outcomes.js
          node test_recommendations.js
          node test_reconciliation.js

      - name: Check JavaScript syntax
        run: |
          node --check evidence.js
          node --check outcomes.js
          node --check recommendations.js
          node --check reconciliation.js
          node --check app.js
          node --check engine.js
          node --check parity_runner.js

      - name: Run Python engine smoke test
        run: python python_engine.py
